name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2BD9CC&color_dots=#ebedf0,#d9c2fb,#b585f5,#9C2CF1,#6913E7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2BD9CC&color_dots=#161b22,#2a0f5e,#3A05C7,#6913E7,#9C2CF1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
