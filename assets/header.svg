    <rect x="0" y="152" width="1200" height="2.0" fill="#000"/><rect x="0" y="164" width="1200" height="3.3" fill="#000"/><rect x="0" y="176" width="1200" height="4.6" fill="#000"/><rect x="0" y="188" width="1200" height="5.9" fill="#000"/><rect x="0" y="200" width="1200" height="7.2" fill="#000"/><rect x="0" y="212" width="1200" height="8.5" fill="#000"/>
  </mask>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
